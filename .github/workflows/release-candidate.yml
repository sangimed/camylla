name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the v prefix (for example 0.6.0-alpha.1)
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Build unsigned release candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version
        id: release
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          $versionCode = '${{ inputs.version_code }}'
          if ($versionCode -notmatch '^[1-9][0-9]*$') { throw "Invalid Android version code: $versionCode" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
      - name: Build candidate
        shell: pwsh
        run: ./scripts/release/Build-ReleaseCandidate.ps1 -Version '${{ steps.release.outputs.version }}' -VersionCode '${{ steps.release.outputs.version_code }}'
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: Camylla-${{ steps.release.outputs.version }}-unsigned-candidate
          path: |
            artifacts/release-candidate/Camylla-${{ steps.release.outputs.version }}-android-unsigned.apk
            artifacts/release-candidate/Camylla-${{ steps.release.outputs.version }}-windows-x64-portable-unsigned.zip
            artifacts/release-candidate/candidate-manifest.json
            artifacts/release-candidate/SHA256SUMS
          if-no-files-found: error
